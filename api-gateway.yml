server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

spring:
  reactor:
    context-propagation: auto      # keeps trace ids across reactive threads
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: "*"
          routes:
            - id: vehicule-service
              uri: lb://vehicule-service
              predicates:
                - Path=/api/vehicules/**
              filters:
                - StripPrefix=1
            - id: client-service
              uri: lb://client-service
              predicates:
                - Path=/api/clients/**
              filters:
                - StripPrefix=1
            - id: location-service
              uri: lb://location-service
              predicates:
                - Path=/api/locations/**
              filters:
                - StripPrefix=1