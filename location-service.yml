server:
  port: 8083

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

driveeasy:
  location:
    penalite-coefficient: 1.5
    remise-fidele: 0.05
    remise-vip: 0.10
    coefficient-economique: 1.0
    coefficient-berline: 1.2
    coefficient-suv: 1.5
    seuil-fidele: 5
    seuil-vip: 15